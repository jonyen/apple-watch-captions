name: PhoneCaptions
options:
  bundleIdPrefix: com.jonyen.phonecaptions
  deploymentTarget:
    iOS: "17.0"
packages:
  CaptionRelay:
    path: ../CaptionRelay
targets:
  PhoneCaptions:
    type: application
    platform: iOS
    sources:
      - path: PhoneCaptions
        excludes:
          - Icon      # editable vector source; the built icon is the asset catalog
      # The app writes settings to the relay, so it needs the credentials; the
      # uploading itself still happens only in the extension.
      - path: Shared
        includes:
          - Secrets.swift
    dependencies:
      - target: PhoneCaptionsUpload
      - package: CaptionRelay
    info:
      path: PhoneCaptions/Info.plist
      properties:
        CFBundleDisplayName: Watch Captions Relay
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonyen.phonecaptions
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Signed by the free personal team, which is why there are no
        # entitlements: App Groups, push, and the rest are paid-membership
        # capabilities, and free provisioning refuses a build that asks for one.
        # That constraint is why the phone and the Watch agree on a fixed
        # session id rather than negotiating one.
        DEVELOPMENT_TEAM: "7PZN69YDL4"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PhoneCaptionsUpload:
    type: app-extension
    platform: iOS
    sources:
      - path: PhoneCaptionsUpload
      - path: Shared
        excludes:
          - Secrets.example.swift
    dependencies:
      - package: CaptionRelay
    info:
      path: PhoneCaptionsUpload/Info.plist
      properties:
        CFBundleDisplayName: Watch Captions Relay
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          # Must be one of Apple's two literal modes. Anything else and the
          # extension is silently filtered out of the broadcast picker — it
          # installs, it registers, and it never appears.
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonyen.phonecaptions.upload
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "7PZN69YDL4"
        CODE_SIGN_STYLE: Automatic
