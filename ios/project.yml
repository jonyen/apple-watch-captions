name: PhoneCaptions
options:
  bundleIdPrefix: com.jonyen.phonecaptions
  deploymentTarget:
    iOS: "17.0"
packages:
  CaptionCore:
    path: ../watch/CaptionCore
targets:
  PhoneCaptions:
    type: application
    platform: iOS
    sources:
      - path: PhoneCaptions
      - path: Shared
        excludes:
          - Secrets.example.swift
    dependencies:
      - package: CaptionCore
    info:
      path: PhoneCaptions/Info.plist
      properties:
        CFBundleDisplayName: Phone Captions
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Captions what your phone is playing, read on your Apple Watch."
        # The app is useful only while it keeps listening: captions have to
        # start the moment you raise your wrist, and the phone is locked in a
        # pocket by then. Without this the capture dies with the screen.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonyen.phonecaptions
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Signed by the free personal team, which is why there are no
        # entitlements: App Groups, push, and the rest are paid-membership
        # capabilities, and free provisioning refuses a build that asks for one.
        # That constraint is why the phone and the Watch agree on a fixed
        # session id rather than negotiating one.
        DEVELOPMENT_TEAM: "7PZN69YDL4"
        CODE_SIGN_STYLE: Automatic
