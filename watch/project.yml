name: WatchCaptions
options:
  bundleIdPrefix: com.jonyen.watchcaptions
  deploymentTarget:
    watchOS: "10.0"
packages:
  CaptionCore:
    path: CaptionCore
  CaptionRelay:
    path: ../CaptionRelay
targets:
  WatchCaptions:
    type: application
    platform: watchOS
    sources:
      - path: WatchCaptions
        excludes:
          - Secrets.example.swift
          - Icon
    dependencies:
      - package: CaptionCore
      - package: CaptionRelay
    postCompileScripts:
      # Stamps GitCommit into the built Info.plist for the home screen's build
      # line. After the plist is processed, before signing, and every build —
      # it has no outputs to date-check against.
      - name: Stamp git commit
        script: '"$PROJECT_DIR/Scripts/stamp-git-commit.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: WatchCaptions/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        CFBundleDisplayName: Captions
        NSMicrophoneUsageDescription: "Used to caption what people near you are saying."
        # Keeps the app running with the mic live when the wrist drops and the
        # screen turns off, so a conversation is not cut in half by a glance away.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonyen.watchcaptions.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        # The commit stamp reaches outside the sandbox: it runs git in the
        # checkout and edits the built plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "7PZN69YDL4"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
