<!doctype html>
<!-- Source for og-image.png, the 1200x630 link-preview card. Rendered by
     render.mjs; edit here, then regenerate. Colours match style.css (dark). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --text: #f2f2f7;
    --muted: #a9a9b0;
    --accent: #6ea8fe;
    --border: #2c2c2e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 80px 88px;
    display: flex;
    align-items: center;
    gap: 72px;
    background:
      radial-gradient(ellipse 60% 80% at 82% 50%, rgba(110,168,254,0.18), transparent 70%),
      var(--bg);
  }
  .copy { flex: 1; }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 40px;
  }
  .brand img { width: 64px; height: 64px; border-radius: 15px; }
  .brand span { font-size: 36px; font-weight: 600; letter-spacing: -0.01em; }
  h1 {
    font-size: 76px;
    line-height: 1.06;
    letter-spacing: -0.03em;
    font-weight: 700;
    margin-bottom: 28px;
  }
  p {
    font-size: 29px;
    line-height: 1.4;
    color: var(--muted);
    max-width: 590px;
  }
  .watch {
    flex: none;
    width: 374px;
    padding: 18px;
    border-radius: 58px;
    background: #111113;
    border: 2px solid #3a3a3e;
    box-shadow: 0 0 0 10px #1c1c1e, 0 30px 80px rgba(0,0,0,0.6);
  }
  .watch img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 42px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="brand">
      <img src="../apple-touch-icon.png" alt="">
      <span>Captions</span>
    </div>
    <h1>Live captions on your wrist.</h1>
    <p>The watch listens, your iPhone transcribes, and nothing ever leaves your devices.</p>
  </div>
  <div class="watch">
    <img src="../images/watch-captions.png" alt="">
  </div>
</div>
</body>
</html>
